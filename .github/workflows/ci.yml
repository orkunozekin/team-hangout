name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests with coverage
        run: yarn test:coverage --ci --color

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  backend-tests:
    name: Emulator security & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd functions install --frozen-lockfile
      - name: Run isolated Firestore, Auth and callable tests
        run: yarn test:backend

  browser-tests:
    name: Browser workspace & production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            admin/yarn.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: yarn install --frozen-lockfile
      - run: yarn --cwd functions install --frozen-lockfile
      - run: yarn --cwd admin install --frozen-lockfile
      - run: yarn --cwd admin playwright install --with-deps chromium
      - name: Build and test browser against synthetic emulators
        run: yarn test:admin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: admin/test-results/
          if-no-files-found: ignore
